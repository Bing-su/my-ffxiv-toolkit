# https://taskfile.dev

version: "3"

vars:
  GREETING: Hello, FFXIV!

env:
  PYTHONUTF8: "1"

tasks:
  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  fetch:
    aliases: [scrap]
    cmds:
      - bingkit-ffxiv scrap

  replace:
    cmds:
      - bingkit-ffxiv replace {{ .CLI_ARGS }}

  rsv:
    cmds:
      - bingkit-ffxiv rsv {{ .CLI_ARGS }}

  compare:
    cmds:
      - python compare.py -a

  lint:
    cmds:
      - hk run fix -a

  update:
    cmds:
      - uv sync --upgrade --all-extras --all-groups

  update:coinach:
    cmds:
      - bingkit-ffxiv coinach Action
      - bingkit-ffxiv coinach BNpcName
      - rm -f coinach/*.csv

  raidboss:
    cmds:
      - bingkit-ffxiv raidboss {{ .CLI_ARGS }}
